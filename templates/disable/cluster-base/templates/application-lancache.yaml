---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: lancache
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "-55"
spec:
  destination:
    namespace: lancache
    server: 'https://kubernetes.default.svc'
  source:
    repoURL: 'https://k8s-at-home.com/charts'
    targetRevision: 0.6.2
    chart: lancache
    helm:
      values: |
        image:
          repository: joshuasing/lancache-monolithic
          tag: latest
          pullPolicy: IfNotFound
        service:
          main:
            ports:
              http:
                port: 80
              https:
                enabled: true
                port: 443
          dns:
            enabled: false
            ports:
              dns:
                port: 53
        dnsConfig:
          nameservers:
            - 10.17.84.2
        dns:
          enabled: true
          env: {}
          image:
            repository: joshuasing/lancache-dns
            tag: latest
            pullPolicy: IfNotFound
        persistence:
          data:
            enabled: false
            mountPath: /data/cache
          logs:
            enabled: false
            mountPath: /data/logs
        nodeSelector:
          kubernetes.io/arch: arm64
          kubernetes.io/hostname: nanopi03

  sources: []
  project: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
