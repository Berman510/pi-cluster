apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: frigate
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://blakeblackshear.github.io/blakeshome-charts/'
    targetRevision: 7.6.0
    chart: frigate
    helm:
      values: |
        config: |
          mqtt:
            host: 10.17.84.2
            port: 1883
            user: hassio
            password: hassiopass
          cameras:
            livingroom:
              ffmpeg:
                inputs:
                  - path: rtsp://10.17.84.156/ch0_0.h264
                    roles:
                      - detect
              record:
                enabled: true
                retain:
                  days: 14
                  mode: all
                events:
                  retain:
                    default: 14
                    mode: active_objects
              zones:
                Couch:
                  coordinates: 0.296,0.9,0.243,0.701,0.529,0.588,0.86,0.665,0.799,0.936,0.577,0.817
                  loitering_time: 60
                Back_Door:
                  coordinates: 0.367,0.628,0.444,0.63,0.451,0.36,0.379,0.356,0.325,0.356,0.325,0.622
                  loitering_time: 10
                Coffe_Station:
                  coordinates: 0.178,0.457,0.176,0.644,0.265,0.636,0.27,0.466
                  loitering_time: 30
                Kitchen:
                  coordinates: 0.006,0.815,0.116,0.79,0.104,0.486,0.011,0.491
                  loitering_time: 60
                Back_Windows:
                  coordinates: 0.943,0.63,0.636,0.559,0.638,0.254,0.947,0.225
                  loitering_time: 60
        nodeSelector:
          kubernetes.io/hostname: nanopi02
        persistence:
          data:
            enabled: true
            storageClass: nfs-client
            size: "10Gi"
          media:
            enabled: true
            storageClass: nfs-client
            size: "10Gi"
          config:
            enabled: enabled
            storageClass: nfs-client
            size: "250Mi"
        ingress:
          enabled: true
          hosts:
            - host: "frigate.{{ .Values.global.domain }}"
              paths:
                - path: "/"
                  portName: http
          tls:
            - hosts:
              - frigate.{{ .Values.global.domain }}
              secretName: my-cert-tls

  destination:
    server: 'https://kubernetes.default.svc'
    namespace: nvr
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
