---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: homebridge
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "-55"
spec:
  destination:
    namespace: homebridge
    server: 'https://kubernetes.default.svc'
  source:
    repoURL: 'tccr.io/truecharts'
    targetRevision: 7.6.0
    chart: homebridge
    helm:
      parameters:
        - name: debug
          value: "true"
      values: |
        image:
          repository: homebridge/homebridge
          tag: latest
          pullPolicy: IfNotPresent
        persistence:
          config:
            enabled: true
        podOptions:
          nodeSelector:
            kubernetes.io/arch: arm64
            kubernetes.io/hostname: nanopi03

  sources: []
  project: default
  syncPolicy:
    automated:
      prune: true
      allowEmpty: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
